
name: Find Mishary Chapter Reciter ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-reciter:
    runs-on: ubuntu-latest

    steps:
      - name: Get token and find chapter reciter
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const auth = Buffer.from(
            `${process.env.QF_CLIENT_ID}:${process.env.QF_CLIENT_SECRET}`
          ).toString('base64');

          async function main() {
            if (!process.env.QF_CLIENT_ID ||
                !process.env.QF_CLIENT_SECRET) {
              throw new Error('GitHub production secrets are missing.');
            }

            const tokenResponse = await fetch(
              'https://oauth2.quran.foundation/oauth2/token',
              {
                method: 'POST',
                headers: {
                  Authorization: `Basic ${auth}`,
                  'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                  grant_type: 'client_credentials',
                  scope: 'content.audio.read'
                })
              }
            );

            if (!tokenResponse.ok) {
              throw new Error(
                `Token request failed: HTTP ${tokenResponse.status}. Check credentials and approved scope.`
              );
            }

            const tokenData = await tokenResponse.json();

            if (!tokenData.access_token) {
              throw new Error('Token response did not contain an access token.');
            }

            console.log('Production access token obtained successfully.');

            const response = await fetch(
              'https://apis.quran.foundation/content/api/v4/resources/chapter_reciters?language=en',
              {
                headers: {
                  'x-auth-token': tokenData.access_token,
                  'x-client-id': process.env.QF_CLIENT_ID,
                  Accept: 'application/json'
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `Chapter-reciter request failed: HTTP ${response.status}. Check audio permission and API access.`
              );
            }

            const data = await response.json();
            const reciters = data.reciters || [];

            const matches = reciters.filter(r =>
              /mishary|mishari|alafasy|afasy/i.test(r.name || '')
            );

            if (!matches.length) {
              console.log('No Mishary/Alafasy name match found.');
              console.log('Available names:');
              reciters.forEach(r => console.log(r.name));
              throw new Error('Could not verify Mishary chapter-reciter entry.');
            }

            console.log('Verified matching chapter-reciter entries:');

            matches.forEach(r => {
              console.log(JSON.stringify({
                id: r.id,
                name: r.name,
                reciter_id: r.reciter_id,
                style: r.style?.name || r.style
              }));
            });

            console.log(
              'Use the id field, not reciter_id. Check the style before choosing.'
            );
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
