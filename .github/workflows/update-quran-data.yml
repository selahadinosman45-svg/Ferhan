
name: Update Quran Recitation Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quran-recitation-update
  cancel-in-progress: false

jobs:
  update-recitation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check configuration
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_CHAPTER_RECITER_ID: ${{ vars.QF_CHAPTER_RECITER_ID }}
          QF_RECITER_NAME: ${{ vars.QF_RECITER_NAME }}
        run: |
          test -n "$QF_CLIENT_ID" || {
            echo "::error::Missing QF_CLIENT_ID secret"
            exit 1
          }
          test -n "$QF_CLIENT_SECRET" || {
            echo "::error::Missing QF_CLIENT_SECRET secret"
            exit 1
          }
          test -n "$QF_CHAPTER_RECITER_ID" || {
            echo "::error::Missing QF_CHAPTER_RECITER_ID variable"
            exit 1
          }
          test -f scripts/update-recitation.mjs || {
            echo "::error::scripts/update-recitation.mjs is missing"
            exit 1
          }
          echo "Configuration checks passed."

      - name: Update recitation data
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_CHAPTER_RECITER_ID: ${{ vars.QF_CHAPTER_RECITER_ID }}
          QF_RECITER_NAME: ${{ vars.QF_RECITER_NAME }}
        run: node scripts/update-recitation.mjs

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Quran recitation data"
            git push
          fi
